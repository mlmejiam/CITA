<div class="shell">
  <aside [class.open]="menu()">
    <app-sidebar (linkClick)="menu.set(false)" />
  </aside>
  <main>
    <header>
      <button class="hamb" (click)="menu.set(!menu())">☰</button>
      <div>
        <small>{{ fechaHoy }}</small>
        <h1>{{ titulo() }}</h1>
      </div>
      <button class="refrescar" (click)="actualizar()" [disabled]="store.cargando()" title="Buscar reservas nuevas">
        {{ store.cargando() ? '…' : '↻' }}
      </button>
    </header>
    @if (store.listo()) {
      <router-outlet />
    } @else if (store.error()) {
      <section class="estado">
        <p>{{ store.error() }}</p>
        <button class="primary" (click)="actualizar()">Reintentar</button>
      </section>
    } @else {
      <section class="estado"><p>Cargando tu agenda…</p></section>
    }
    <footer>
      © 2026 Cita Linda <span>Hecho con ♡ para profesionales independientes</span>
    </footer>
  </main>
  @if (menu()) {
    <div class="backdrop" (click)="menu.set(false)"></div>
  }
</div>
